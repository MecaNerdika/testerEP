<style>
/* Layout: sticky header with progress, question map in a side column (wraps above on phones), one question card at a time with instant feedback. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#14192b; --muted:#5b6479; --line:#d9deea;
  --accent:#2b4fd8; --accent-fg:#ffffff; --accent-soft:#e4eaff;
  --good:#16794c; --good-soft:#dff3e8; --bad:#b4281f; --bad-soft:#fbe4e1;
  --fig:#ffffff;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#181d2e; --fg:#e8ebf5; --muted:#9aa3ba; --line:#2b3350;
  --accent:#7d98ff; --accent-fg:#0f1320; --accent-soft:#222c52;
  --good:#5fd39a; --good-soft:#15332a; --bad:#ff8d83; --bad-soft:#3b1f21; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#181d2e; --fg:#e8ebf5; --muted:#9aa3ba; --line:#2b3350;
  --accent:#7d98ff; --accent-fg:#0f1320; --accent-soft:#222c52;
  --good:#5fd39a; --good-soft:#15332a; --bad:#ff8d83; --bad-soft:#3b1f21; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
h1{font:800 clamp(1.7rem,4.5vw,2.5rem)/1.05 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:52ch}
.score{display:flex;gap:10px;align-items:center}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px}
.stat b{display:block;font:700 1.35rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font:500 .7rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
main{display:grid;grid-template-columns:minmax(0,248px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px}
@media (max-width:820px){aside{position:static}}
aside h2{font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.grp{margin-bottom:14px}.grp:last-of-type{margin-bottom:0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.chip{font:600 .85rem/1 var(--mono);height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip[aria-current="true"]{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reset{margin-top:16px;width:100%}
.btn{font:600 .95rem/1 var(--body);border-radius:10px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,3vw,24px);min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.qno{font:800 1.6rem/1 var(--display)}
.qtag{font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.inst{color:var(--muted);margin:0 0 14px}
.fig{background:var(--fig);border-radius:10px;border:1px solid var(--line);overflow-x:auto;position:relative}
.fig svg{display:block;width:100%;height:auto}
.fig.big svg{width:900px;max-width:none}
.zoom{margin:8px 0 0;font:500 .8rem/1 var(--mono);background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0}
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.opt{font:700 1.1rem/1 var(--mono);height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.verdict{font:700 1.05rem/1.3 var(--display);padding:10px 14px;border-radius:10px;margin:0 0 12px}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.expl{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.expl h3{font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.expl p{margin:0 0 10px;max-width:68ch}
.expl p.b{font-weight:600;margin-top:16px}
.expl .fig{max-width:420px;margin:6px 0 14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.final{text-align:left}
.final h2{font:800 2rem/1.1 var(--display);margin:0 0 6px}
.final .big{font:700 3rem/1 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.hint{font:500 .78rem/1.4 var(--mono);color:var(--muted);margin-top:12px}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;font:500 .75rem/1 var(--mono);padding:8px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
<header>
  <div>
    <h1>Latihan Jaring-jaring Kubus</h1>
    <p class="sub">20 soal analogi gambar. Pilih jawaban, lalu lihat pembahasan langkah demi langkah.</p>

  <div class="score" aria-live="polite">

    <button class="theme" id="themeBtn" type="button">Tema</button>

</header>
<div class="bar" role="progressbar" aria-label="Kemajuan" aria-valuemin="0" aria-valuemax="20" id="barWrap"><i id="bar"></i></div>

<main>

    <div class="grp"><h2>Bagian B · jaring-jaring dari kubus</h2><div class="chips" id="chipsB"></div></div>

    <p class="hint">Tombol keyboard: A–E untuk menjawab, ← → untuk pindah soal.</p>
  </aside>
  <section id="stage" aria-live="polite"></section>
</main>
</div>

};
const SUB = { symbol: 'Simbol', number: 'Angka', dice: 'Mata dadu' };
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function chips() {
  ['A', 'B'].forEach(p => {
    const box = $('chips' + p); box.textContent = '';
    Q.forEach((q, i) => {
      if ((p === 'A') !== (q.kind === 'net2cube')) return;
      const b = el('button', 'chip', q.no); b.type = 'button';
      const a = ans[q.no];
      if (a) b.classList.add(a === q.ans ? 'ok' : 'no');
      if (i === cur) b.setAttribute('aria-current', 'true');
      b.setAttribute('aria-label', 'Soal ' + q.no + (a ? (a === q.ans ? ', benar' : ', salah') : ''));
      b.onclick = () => go(i);
      box.appendChild(b);
    });
  });
}
function stats() {
  const done = Object.keys(ans).length, ok = Q.filter(q => ans[q.no] === q.ans).length;
  $('sDone').textContent = done + '/' + Q.length; $('sOk').textContent = ok;
  $('bar').style.width = (done / Q.length * 100) + '%'; $('barWrap').setAttribute('aria-valuenow', done);
}
function render() {
  chips(); stats();
  const st = $('stage'); st.textContent = '';
  if (cur === 'end') return final(st);
  const q = Q[cur], a = ans[q.no], card = el('div', 'card');
  const h = el('div', 'qhead'); h.append(el('span', 'qno', 'Soal ' + q.no),
    el('span', 'qtag', (q.kind === 'net2cube' ? 'Bagian A' : 'Bagian B') + ' · ' + SUB[q.sub]));
  card.append(h, el('p', 'inst', INST[q.kind]));
  const fig = el('div', 'fig' + (zoom ? ' big' : '')); fig.innerHTML = q.svg; fig.setAttribute('role', 'img'); fig.setAttribute('aria-label', 'Gambar soal ' + q.no);
  const zb = el('button', 'zoom', zoom ? '− Perkecil gambar' : '+ Perbesar gambar'); zb.type = 'button';
  zb.onclick = () => { zoom = !zoom; render(); };
  card.append(fig, zb);
  const opts = el('div', 'opts'); opts.setAttribute('role', 'group'); opts.setAttribute('aria-label', 'Pilihan jawaban');
  'ABCDE'.split('').forEach(L => {
    const b = el('button', 'opt', L); b.type = 'button'; b.disabled = !!a;
    if (a) { if (L === q.ans) b.classList.add('good'); else if (L === a) b.classList.add('bad'); }
    b.onclick = () => pick(L); opts.appendChild(b);
  });
  card.appendChild(opts);
  if (a) {
    const ok = a === q.ans;
    card.appendChild(el('p', 'verdict ' + (ok ? 'good' : 'bad'), ok ? 'Benar. Jawabannya ' + q.ans + '.' : 'Belum tepat. Kamu memilih ' + a + ', jawaban yang benar ' + q.ans + '.'));
    const ex = el('div', 'expl'); ex.appendChild(el('h3', null, 'Pembahasan'));
    q.ex.forEach(e => {
      if (e.t === 'p') ex.appendChild(el('p', e.b ? 'b' : '', e.s));
      else { const f = el('div', 'fig'); f.innerHTML = e.svg; f.setAttribute('role', 'img'); f.setAttribute('aria-label', 'Gambar pembahasan'); ex.appendChild(f); }
    });
    card.appendChild(ex);
  }
  const nav = el('div', 'nav');
  const pv = el('button', 'btn', '← Sebelumnya'); pv.type = 'button'; pv.disabled = cur === 0; pv.onclick = () => go(cur - 1);
  const nx = el('button', 'btn primary', cur === Q.length - 1 ? 'Lihat hasil' : 'Berikutnya →'); nx.type = 'button';
  nx.onclick = () => cur === Q.length - 1 ? go('end') : go(cur + 1);
  nav.append(pv, nx); card.appendChild(nav);
  st.appendChild(card);
}
function final(st) {
  const ok = Q.filter(q => ans[q.no] === q.ans).length, done = Object.keys(ans).length;
  const c = el('div', 'card final');
  c.append(el('h2', null, 'Hasil latihan'), el('div', 'big', ok + ' / ' + Q.length));
  const A = Q.filter(q => q.kind === 'net2cube'), B = Q.filter(q => q.kind === 'cube2net');
  const n = l => l.filter(q => ans[q.no] === q.ans).length;
  c.append(el('p', null, 'Bagian A (jaring-jaring ke kubus): ' + n(A) + ' dari ' + A.length + ' benar. Bagian B (kubus ke jaring-jaring): ' + n(B) + ' dari ' + B.length + ' benar.'));
  if (done < Q.length) c.append(el('p', null, Q.length - done + ' soal belum dijawab. Pilih nomornya di daftar soal.'));
  const wrong = Q.filter(q => ans[q.no] && ans[q.no] !== q.ans).map(q => q.no);
  if (wrong.length) c.append(el('p', null, 'Soal yang salah: ' + wrong.join(', ') + '. Buka lagi nomornya untuk membaca pembahasan.'));
  const b = el('button', 'btn primary', 'Kembali ke soal 1'); b.type = 'button'; b.onclick = () => go(0); c.appendChild(b);
  st.appendChild(c);
}
function go(i) { cur = i; save(); render(); const s = $('stage'); try { s.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {} }
function pick(L) { const q = Q[cur]; if (typeof cur !== 'number' || ans[q.no]) return; ans[q.no] = L; save(); render(); }
$('reset').onclick = function () {
  if (this.dataset.arm !== '1') { this.dataset.arm = '1'; this.textContent = 'Klik lagi untuk menghapus jawaban'; setTimeout(() => { this.dataset.arm = ''; this.textContent = 'Ulangi dari awal'; }, 3000); return; }
  ans = {}; cur = 0; this.dataset.arm = ''; this.textContent = 'Ulangi dari awal'; save(); render();
};
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if ('ABCDE'.includes(k) && k.length === 1 && typeof cur === 'number') pick(k);
  else if (e.key === 'ArrowRight') { if (cur === 'end') return; go(cur === Q.length - 1 ? 'end' : cur + 1); }
  else if (e.key === 'ArrowLeft') { if (cur === 'end') go(Q.length - 1); else if (cur > 0) go(cur - 1); }
});
$('themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
render();
</script>

</body></html>
