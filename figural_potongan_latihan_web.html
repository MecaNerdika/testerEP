<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figural: Menyusun Potongan - Latihan Soal</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#222;--muted:#666;--line:#d6d6d2;--accent:#2f5d8a;--ok:#1f7a45;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#1f1f1f;--text:#eaeaea;--muted:#a0a0a0;--line:#3a3a3a;--accent:#7fb0e0;--ok:#6fd09a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
.petunjuk{font-size:.9rem;color:var(--muted);margin:0 0 14px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:600}
.chips button.cur{outline:2px solid var(--accent)}
.chips button.ok{background:var(--okbg);border-color:var(--ok)}
.chips button.bad{background:var(--badbg);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.qno{font-weight:700;color:var(--accent);margin-bottom:6px}
#soal p{margin:0 0 10px}
.fg-pieces{text-align:center;margin:8px 0}
#opsi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
#opsi button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer}
#opsi button:hover:not(:disabled){border-color:var(--accent)}
#opsi button.correct{border-color:var(--ok);background:var(--okbg)}
#opsi button.wrong{border-color:var(--bad);background:var(--badbg)}
#opsi button:disabled{cursor:default}
#opsi .fig{width:100%;max-width:120px}
.lbl{font-size:.9rem;color:var(--muted)}
@media (max-width:480px){#opsi{grid-template-columns:repeat(2,1fr)}}
#pemb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;text-align:justify}
#pemb p{margin:0 0 6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.nav button{color:#111}}
.nav button:disabled{opacity:.4;cursor:default}
.nav button.ghost{background:transparent;color:var(--accent)}
#skor{margin-top:14px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="judul"></h1>
  <p class="petunjuk" id="petunjuk"></p>
  <div class="chips" id="chips"></div>
  <div class="card">
    <div class="qno" id="qno"></div>
    <div id="soal"></div>
    <div id="opsi"></div>
    <div id="pemb"></div>
  </div>
  <div class="nav">
    <button class="ghost" id="prev">Sebelumnya</button>
    <button class="ghost" id="skorBtn">Lihat skor</button>
    <button id="next">Berikutnya</button>
  </div>
  <div id="skor"></div>
</div>

engan potongan di kiri. Pilihan F terbagi menjadi bagian dengan luas sekitar 23%, 24%, 26%, 27%, tidak sama dengan potongan di kiri. Jadi, jawaban yang benar adalah B.<\/p><p><strong>Jawaban: B<\/strong><\/p>"}]};
const $ = id => document.getElementById(id);
let cur = 0;
const jawab = {};

function render() {
  const q = DATA.soal[cur];
  $('qno').textContent = 'Soal ' + q.no + ' dari ' + DATA.soal.length;
  $('soal').innerHTML = q.soal_html;                 // kalimat soal + SVG potongan
  const opsi = $('opsi'); opsi.innerHTML = '';
  const done = jawab[cur] !== undefined;
  for (const L of Object.keys(q.opsi)) {
    const b = document.createElement('button');
    b.innerHTML = '<span class="fig">' + q.opsi[L] + '</span><span class="lbl">' + L + '</span>';   // SVG pilihan
    b.disabled = done;
    if (done && L === q.kunci) b.classList.add('correct');
    if (done && L === jawab[cur] && L !== q.kunci) b.classList.add('wrong');
    b.onclick = () => { jawab[cur] = L; render(); };
    opsi.appendChild(b);
  }
  $('pemb').innerHTML = done ? q.pembahasan_html : '';
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === DATA.soal.length - 1;
  renderChips();
}
function renderChips() {
  const c = $('chips'); c.innerHTML = '';
  DATA.soal.forEach((q, i) => {
    const b = document.createElement('button');
    b.textContent = q.no;
    if (i === cur) b.classList.add('cur');
    if (jawab[i] !== undefined) b.classList.add(jawab[i] === q.kunci ? 'ok' : 'bad');
    b.onclick = () => { cur = i; render(); };
    c.appendChild(b);
  });
}
$('judul').textContent = DATA.judul;
$('petunjuk').textContent = DATA.petunjuk;
$('prev').onclick = () => { if (cur > 0) { cur--; render(); } };
$('next').onclick = () => { if (cur < DATA.soal.length - 1) { cur++; render(); } };
$('skorBtn').onclick = () => {
  const n = DATA.soal.length, d = Object.keys(jawab).length;
  const benar = DATA.soal.filter((q, i) => jawab[i] === q.kunci).length;
  $('skor').textContent = 'Terjawab ' + d + '/' + n + ' | Benar ' + benar;
};
render();
</script>
