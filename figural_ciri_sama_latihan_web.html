<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figural: Ciri yang Sama - Latihan Soal</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#222;--muted:#666;--line:#d6d6d2;--accent:#2f5d8a;--ok:#1f7a45;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#1f1f1f;--text:#eaeaea;--muted:#a0a0a0;--line:#3a3a3a;--accent:#7fb0e0;--ok:#6fd09a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
.petunjuk{font-size:.9rem;color:var(--muted);margin:0 0 14px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:600}
.chips button.cur{outline:2px solid var(--accent)}
.chips button.ok{background:var(--okbg);border-color:var(--ok)}
.chips button.bad{background:var(--badbg);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.qno{font-weight:700;color:var(--accent);margin-bottom:6px}
#soal p{margin:0 0 10px}
.fg-left,.fg-right{text-align:center;margin:8px 0}
#opsi{display:grid;gap:8px;margin-top:14px}
#opsi button{text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:1rem}
#opsi button:hover:not(:disabled){border-color:var(--accent)}
#opsi button.correct{border-color:var(--ok);background:var(--okbg)}
#opsi button.wrong{border-color:var(--bad);background:var(--badbg)}
#opsi button:disabled{cursor:default}
#pemb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;text-align:justify}
#pemb p{margin:0 0 6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.nav button{color:#111}}
.nav button:disabled{opacity:.4;cursor:default}
.nav button.ghost{background:transparent;color:var(--accent)}
#skor{margin-top:14px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="judul"></h1>
  <p class="petunjuk" id="petunjuk"></p>
  <div class="chips" id="chips"></div>

    <div class="qno" id="qno"></div>
    <div id="soal"></div>
    <div id="opsi"></div>
    <div id="pemb"></div>
  </div>
  <div class="nav">
    <button class="ghost" id="prev">Sebelumnya</button>
    <button class="ghost" id="skorBtn">Lihat skor</button>
    <button id="next">Berikutnya</button>
  </div>
  <div id="skor"></div>
</div>

ar yang sesuai adalah pilihan d.<\/p><p><strong>Jawaban: D (d)<\/strong><\/p>"}, {"no": 4, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><polygon points=\"22.0,40.7 10.9,25.0 22.0,9.3 33.1,25.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"9.3\" x2=\"19.3\" y2=\"36.9\" stroke=\"currentColor\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><polygon points=\"66.0,42.1 51.2,16.5 80.8,16.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/><line x1=\"75.8\" y1=\"25.2\" x2=\"57.3\" y2=\"27.1\" stroke=\"currentColor\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><polygon points=\"110.0,8.9 126.1,25.0 110.0,41.1 93.9,25.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/><line x1=\"94.1\" y1=\"25.2\" x2=\"124.6\" y2=\"26.5\" stroke=\"currentColor\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><polygon points=\"169.0 nt-size=\"7.5\" font-weight=\"700\" fill=\"currentColor\">(e)<\/text><text x=\"242.0\" y=\"57.0\" dy=\"0.35em\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"7.5\" font-weight=\"700\" fill=\"currentColor\">(f)<\/text><\/svg><\/div>", "opsi": {"A": "a dan e", "B": "b dan d", "C": "b, d, dan f", "D": "b dan f"}, "kunci": "C", "pembahasan_html": "<p><strong>Pembahasan:<\/strong> Keempat gambar di sebelah kiri memiliki ciri yang sama, yaitu berupa bangun bersisi lurus (tanpa sisi lengkung) dan memiliki sebuah lingkaran kecil di dalam bangun. Pilihan a tidak sesuai karena berupa bangun yang memiliki sisi lengkung, bukan bangun bersisi lurus. Pilihan b sesuai: berupa persegi panjang yang memiliki ciri tersebut. Pilihan c tidak sesuai karena benda kecil di dalamnya berupa persegi, bukan lingkaran. Pilihan d sesuai: berupa persegi yang memiliki ciri tersebut. Pilihan e tidak sesuai karena benda kecil di dalamnya berupa segitiga, bukan lingkaran. Pilihan f sesuai: berupa trapesium yang memiliki ciri tersebut. Jadi, gambar yang sesuai adalah pilihan b, d, dan f.<\/p><p><strong>Jawaban: C (b, d, dan f)<\/strong><\/p>"}, {"no": 7, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/ ", "opsi": {"A": "c dan d", "B": "b, c, dan d", "C": "d dan f", "D": "c, d, dan f"}, "kunci": "D", "pembahasan_html": "<p><strong>Pembahasan:<\/strong> Keempat gambar di sebelah kiri memiliki ciri yang sama, yaitu berupa bangun yang memiliki sisi lengkung dan seluruh bangunnya diarsir. Pilihan a tidak sesuai karena berupa bangun bersisi lurus, bukan bangun lengkung. Pilihan b tidak sesuai karena berupa bangun bersisi lurus, bukan bangun lengkung. Pilihan c sesuai: berupa lingkaran yang memiliki ciri tersebut. Pilihan d sesuai: berupa elips yang memiliki ciri tersebut. Pilihan e tidak sesuai karena bangunnya diisi titik-titik, bukan arsiran. Pilihan f sesuai: berupa setengah lingkaran yang memiliki ciri tersebut. Jadi, gambar yang sesuai adalah pilihan c, d, dan f.<\/p><p><strong>Jawaban: D (c, d, dan f)<\/strong><\/p>"}, {"no": 8, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><polygon points=\"22.0,9.3 33.1,25.0 22.0,40.7 10.9,25.0\" fill=\"none\" st . Pilihan a tidak sesuai karena benda kecil di dalamnya berupa persegi, bukan lingkaran. Pilihan b tidak sesuai karena lingkaran kecilnya menempel pada garis tepi, bukan berada di dalam bangun. Pilihan c tidak sesuai karena berupa elips yang bukan segi empat. Pilihan d tidak sesuai karena berupa segi lima yang bukan segi empat. Pilihan e tidak sesuai karena berupa lingkaran yang bukan segi empat. Pilihan f sesuai: berupa trapesium yang memiliki ciri tersebut. Jadi, gambar yang sesuai adalah pilihan f.<\/p><p><strong>Jawaban: C (f)<\/strong><\/p>"}, {"no": 12, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><polygon points=\"35.6,35.3 34.1,36.0 32.6,36.6 31.0,37.0 29.4,37.3 27.8,37.4 26.1,37.3 24.5,37.0 22.9,36.6 21.4,36.0 19.9,35.3 18.5,34.4 17.3,33.3 16.1,32.2 15.1,30.9 14.2,29.5 13.4,28.1 12.8,26.5 12.4,24.9 12.2,23.3 12.1,21.7 12.2,20.0 12.4,18.4 12.8,16.8 13.4,15.3 14.2,13.8 15.1,12.5 16.1,11.2 17.3,10.0 18.5,9.0 19.9,8.1\" fill=\"none\" stroke=\"c i kecil di dalam bangun. Pilihan a tidak sesuai karena tidak ada persegi kecil di dalam bangun. Pilihan b sesuai: berupa lingkaran yang memiliki ciri tersebut. Pilihan c tidak sesuai karena benda kecil di dalamnya berupa segitiga, bukan persegi. Pilihan d sesuai: berupa setengah lingkaran yang memiliki ciri tersebut. Pilihan e tidak sesuai karena berupa bangun bersisi lurus, bukan bangun lengkung. Pilihan f sesuai: berupa elips yang memiliki ciri tersebut. Jadi, gambar yang sesuai adalah pilihan b, d, dan f.<\/p><p><strong>Jawaban: C (b, d, dan f)<\/strong><\/p>"}, {"no": 13, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><polygon points=\"36.8,33.5 36.1,34.5 35.3,35.4 34.4,36.1 33.3,36.7 32.0,37.2 30.7,37.6 29.3,37.8 27.8,37.9 26.2,37.8 24.6,37.6 22.9,37.3 21.3,36.8 19.6,36.2 18.0,35.5 16.4,34.6 14.9,33.7 13.5,32.6 12.1,31.5 10.9,30.3 9.8,29.1 8.8,27.8 8.0,26.4 7.3,25.1 6.8,23.7 6.4,22.4 6.2,21.1 6.2,19.8 6.4,18.6 6.7,17.5 7.2,16.5 7.9,15.5 8.7,14.6 \"0.35em\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"7.5\" font-weight=\"700\" fill=\"currentColor\">(f)<\/text><\/svg><\/div>", "opsi": {"A": "e dan f", "B": "b", "C": "f", "D": "b dan f"}, "kunci": "D", "pembahasan_html": "<p><strong>Pembahasan:<\/strong> Keempat gambar di sebelah kiri memiliki ciri yang sama, yaitu berupa bangun yang memiliki sisi lengkung dan memiliki garis ganda (ada bangun sejenis yang lebih kecil di dalam bangun luarnya). Pilihan a tidak sesuai karena berupa bangun bersisi lurus, bukan bangun lengkung. Pilihan b sesuai: berupa lingkaran yang memiliki ciri tersebut. Pilihan c tidak sesuai karena garis tepinya hanya satu, tidak ada bangun di dalamnya. Pilihan d tidak sesuai karena berupa bangun bersisi lurus, bukan bangun lengkung. Pilihan e tidak sesuai karena bangun di dalamnya berbeda bentuk dengan bangun luarnya, bukan bangun sejenis. Pilihan f sesuai: berupa elips yang memiliki ciri tersebut. Jadi, gambar yang sesuai adalah pilihan b dan f.<\/p><p><strong>Jawaban: D (b dan f)<\/strong><\/p>"}, {"no": 14, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-w Jawaban: B (a)<\/strong><\/p>"}, {"no": 16, "pertanyaan": "Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.", "soal_html": "<p>Keempat gambar di sebelah kiri memiliki ciri yang sama. Pilihlah semua gambar (a-f) di sebelah kanan yang memiliki ciri yang sama dengan keempat gambar tersebut.<\/p><div class=\"fg-left\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 50\" width=\"300\" height=\"85\" role=\"img\" aria-label=\"Empat gambar di kiri\" style=\"max-width:100%;height:auto\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,50.0 0.0,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"50.0\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-linecap=\"round\"/><polygon points=\"38.5,29.4 38.1,30.5 37.6,31.6 36.8,32.5 35.9,33.4 34.9,34.2 33.7,34.9 32.3,35.5 30.9,35.9 29.4,36.3 27.8,36.5 26.1,36.6 24.4,36.6 22.6,36.4 20.9,36.1 19.1,35.7 17.4,35.2 15.8,34.6 14.2,33.8 12.7,33.0 11.2,32.1 10.0,31.1 8.8,30.0 7.8,28.9 6.9,27.7 6.3,26.5 5.7,25.3 5.4,24.1 5.2,22.9 5.3,21.7 5.5,20.6 5.9,19.5 6.4,18.4 7.2,17.5 8.1,16.6 9.1,15.8 10.3,15.1 11.7,14.5 13.1,14.1 14.6,13.7 16.2,13.5 17.9,13.4 19.6,13.4 21.4,13.6 23.1,13.9 24.9,14.3 26.6,14.8 28.2,15.4 29.8,16.2 31.3,17.0 32.8,17.9 34.0,18.9 35.2,20.0 36.2,21.1 37.1,22.3 37.7,23.5 38.3,24.7 38.6,25.9 38.8,27.1 38.7,28.3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/><polygon points=\"23.4,26.1 23.4,26.7 23.2,27.1 22.9,27.6 22.6,27.9 22.1,28.2 21.6,28.4 21.1,28.4 20.6,28.4 20.1,28.2 19.7,27.9 19.3,27.6 19.0,27.1 18.9,26.7 18.8,26.1 18.9,25.6 19.0 const $ = id => document.getElementById(id);
let cur = 0;
const jawab = {};

function render() {
  const q = DATA.soal[cur];
  $('qno').textContent = 'Soal ' + q.no + ' dari ' + DATA.soal.length;
  $('soal').innerHTML = q.soal_html;              // kalimat soal + SVG jaring-jaring + SVG kubus pilihan
  const opsi = $('opsi'); opsi.innerHTML = '';
  const done = jawab[cur] !== undefined;
  for (const L of ['A','B','C','D']) {
    const b = document.createElement('button');
    b.textContent = L + '.  ' + q.opsi[L];
    b.disabled = done;
    if (done && L === q.kunci) b.classList.add('correct');
    if (done && L === jawab[cur] && L !== q.kunci) b.classList.add('wrong');
    b.onclick = () => { jawab[cur] = L; render(); };
    opsi.appendChild(b);
  }
  $('pemb').innerHTML = done ? q.pembahasan_html : '';
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === DATA.soal.length - 1;
  renderChips();
}
function renderChips() {
  const c = $('chips'); c.innerHTML = '';
  DATA.soal.forEach((q, i) => {
    const b = document.createElement('button');
    b.textContent = q.no;
    if (i === cur) b.classList.add('cur');
    if (jawab[i] !== undefined) b.classList.add(jawab[i] === q.kunci ? 'ok' : 'bad');
    b.onclick = () => { cur = i; render(); };
    c.appendChild(b);
  });
}
$('judul').textContent = DATA.judul;
$('petunjuk').textContent = DATA.petunjuk;
$('prev').onclick = () => { if (cur > 0) { cur--; render(); } };
$('next').onclick = () => { if (cur < DATA.soal.length - 1) { cur++; render(); } };
$('skorBtn').onclick = () => {
  const n = DATA.soal.length, d = Object.keys(jawab).length;
  const benar = DATA.soal.filter((q, i) => jawab[i] === q.kunci).length;
  $('skor').textContent = 'Terjawab ' + d + '/' + n + ' | Benar ' + benar;
};
render();
</script>
</body>
</html>
