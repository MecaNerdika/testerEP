<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaring-Jaring Kubus - Latihan Soal</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#222;--muted:#666;--line:#d6d6d2;--accent:#2f5d8a;--ok:#1f7a45;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#1f1f1f;--text:#eaeaea;--muted:#a0a0a0;--line:#3a3a3a;--accent:#7fb0e0;--ok:#6fd09a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
.petunjuk{font-size:.9rem;color:var(--muted);margin:0 0 14px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:600}
.chips button.cur{outline:2px solid var(--accent)}
.chips button.ok{background:var(--okbg);border-color:var(--ok)}
.chips button.bad{background:var(--badbg);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.qno{font-weight:700;color:var(--accent);margin-bottom:6px}
#soal p{margin:0 0 10px}
.jj-net,.jj-cubes{text-align:center;margin:8px 0}
#opsi{display:grid;gap:8px;margin-top:14px}
#opsi button{text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:1rem}
#opsi button:hover:not(:disabled){border-color:var(--accent)}
#opsi button.correct{border-color:var(--ok);background:var(--okbg)}
#opsi button.wrong{border-color:var(--bad);background:var(--badbg)}
#opsi button:disabled{cursor:default}
#pemb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;text-align:justify}
#pemb p{margin:0 0 6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.nav button{color:#111}}
.nav button:disabled{opacity:.4;cursor:default}
.nav button.ghost{background:transparent;color:var(--accent)}
#skor{margin-top:14px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="judul"></h1>
  <p class="petunjuk" id="petunjuk"></p>
  <div class="chips" id="chips"></div>
  <div class="card">
    <div class="qno" id="qno"></div>
    <div id="soal"></div>
    <div id="opsi"></div>
    <div id="pemb"></div>
  </div>
  <div class="nav">
    <button class="ghost" id="prev">Sebelumnya</button>
    <button class="ghost" id="skorBtn">Lihat skor</button>
    <button id="next">Berikutnya</button>
  </div>
  <div id="skor"></div>
</div>

 sesuai hasil lipatan jaring-jaring (X). Kubus (4) dapat dibentuk karena ketiga sisinya (sisi kosong, sisi bergambar persegi kecil, dan sisi bergambar titik hitam) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Jadi, kubus (3) dan (4) yang dapat dibentuk.<\/p><p><strong>Jawaban: D<\/strong><\/p>"}, {"no": 3, "pertanyaan": "Berapa banyak titik yang terdapat pada sisi yang berlawanan dengan sisi yang memiliki 2 titik ketika gambar di bawah ini dilipat menjadi kubus?", "soal_html": "<p>Berapa banyak titik yang terdapat pada sisi yang berlawanan dengan sisi yang memiliki 2 titik ketika gambar di bawah ini dilipat menjadi kubus?<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 65.0 29.0\" width=\"200\" height=\"89\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,14.5 14.5,14.5 14.5,26.5 2.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"11.5,18.4 11.8,18.3 12.1,18.1 12.3,17.8 12.4,17.5 12.3,17.2 12.1,16.9 11.8,16.7 11.5,16.6 11.2,16.7 10.9,16.9 10.7,17.2 10.6,17.5 10.7,17.8 10.9,18.1 11.2,18.3\" fill=\"currentColor\"/><polygon points=\"8.5,21.4 8.8,21.3 9.1,21.1 9.3,20.8 9.4,20.5 9.3,20.2 9.1,19.9 8.8,19.7 8.5,19.6 8.2,19.7 7.9,19.9 7.7,20.2 7.6,20.5 7.7,20.8 7.9,21.1 8.2,21.3\" fill=\"currentColor\"/><polygon points=\"5.5,24.4 5.8,24.3 6.1,24.1 6.3,23.8 6.4,23.5 6.3,23.2 6.1,22.9 5.8,22.7 5.5,22.6 5.2,22.7 4.9,22.9 4.7,23.2 4.6,23.5 4.7,23.8 4.9,24.1 5.2,24.3\" fill=\"currentColor\"/><polygon points=\"14.5,14.5 26.5,14.5 26.5,26.5 14.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"23.1,18.8 23.5,18.7 23.8,18.5 24.0,18.2 24.0,17.9 24.0,17.5 23.8,17.2 23.5,17.0 23.1,17.0 22.8,17.0 22.5,17.2 22.3,17.5 22.2,17.9 22.3,18.2 22.5,18.5 22.8,18.7\" fill=\"currentColor\"/><polygon points=\"23.1,24.0 23.5,24.0 23.8,23.8 24.0,23.5  hitam penuh berlawanan dengan sisi kosong. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi bergambar arsiran, sisi kosong, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) dapat dibentuk karena ketiga sisinya (sisi bergambar arsiran, sisi hitam penuh, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (3) dapat dibentuk karena ketiga sisinya (sisi kosong, sisi bergambar arsiran, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (4) tidak dapat dibentuk karena memuat sisi bergambar garis tunggal, padahal sisi tersebut tidak ada pada jaring-jaring (X). Jadi, kubus (1), (2), dan (3) yang dapat dibentuk.<\/p><p><strong>Jawaban: B<\/strong><\/p>"}, {"no": 7, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 41.0 53.0\" width=\"200\" height=\"259\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,38.5 14.5,38.5 14.5,50.5 2.5,50.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><text x=\"8.5\" y=\"44.5\" dy=\"0.35em\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"6.0\" font-weight=\"700\" fill=\"currentColor\">C<\/text><polygon points=\"14.5,2.5 26.5,2.5 26.5,14.5 14.5,14.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><text x=\"20.5\" y=\"8.5\" dy=\"0.35em\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"6.0\" font-weight=\"700\" fill=\"currentColor\">A<\/text><polygon points=\"14.5,14.5 26.5,14.5 26.5,26.5 14.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-wi  bergambar persegi kecil; sisi kosong berlawanan dengan sisi bergambar lingkaran kosong. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi bergambar arsiran, sisi kosong, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) tidak dapat dibentuk karena urutan ketiga sisinya (sisi bergambar persegi kecil, sisi kosong, dan sisi bergambar titik hitam) terbalik, seperti bayangan cermin dari hasil lipatan jaring-jaring (X). Kubus (3) dapat dibentuk karena ketiga sisinya (sisi bergambar titik hitam, sisi bergambar persegi kecil, dan sisi bergambar lingkaran kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (4) tidak dapat dibentuk karena urutan ketiga sisinya (sisi bergambar persegi kecil, sisi bergambar lingkaran kosong, dan sisi bergambar arsiran) terbalik, seperti bayangan cermin dari hasil lipatan jaring-jaring (X). Jadi, kubus (1) dan (3) yang dapat dibentuk.<\/p><p><strong>Jawaban: D<\/strong><\/p>"}, {"no": 9, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 53.0 41.0\" width=\"200\" height=\"155\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,14.5 14.5,14.5 14.5,26.5 2.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"4.9\" y1=\"19.4\" x2=\"12.1\" y2=\"19.4\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><line x1=\"4.9\" y1=\"21.6\" x2=\"12.1\" y2=\"21.6\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><polygon points=\"14.5,14.5 26.5,14.5 26.5,26.5 14.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\ anan dengan sisi kosong; sisi bergambar arsiran berlawanan dengan sisi kosong; sisi bergambar garis ganda (=) berlawanan dengan sisi hitam penuh. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi bergambar garis ganda (=), sisi kosong, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) tidak dapat dibentuk karena sisi bergambar garis ganda (=) dan sisi hitam penuh saling berlawanan pada jaring-jaring (X), sehingga tidak mungkin berdekatan. Kubus (3) tidak dapat dibentuk karena arah sisi bergambar arsiran tidak sesuai dengan hasil lipatan jaring-jaring (X). Kubus (4) tidak dapat dibentuk karena memuat 2 sisi bergambar garis ganda (=), padahal jaring-jaring (X) hanya memiliki 1. Jadi, hanya kubus (1) yang dapat dibentuk.<\/p><p><strong>Jawaban: B<\/strong><\/p>"}, {"no": 10, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 53.0 41.0\" width=\"200\" height=\"155\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,14.5 14.5,14.5 14.5,26.5 2.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><line x1=\"2.5\" y1=\"16.2\" x2=\"4.2\" y2=\"14.5\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><line x1=\"2.5\" y1=\"17.7\" x2=\"5.7\" y2=\"14.5\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><line x1=\"2.5\" y1=\"19.2\" x2=\"7.2\" y2=\"14.5\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><line x1=\"2.5\" y1=\"20.7\" x2=\"8.7\" y2=\"14.5\" stroke=\"currentColor\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><line x1=\"2.5\" y1=\"22.2\" x2=\"10.2\" y2=\"14.5\" stroke=\"currentColor\" stroke-width=\"0.7\" strok uk persegi panjang. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi bergambar setengah hitam berbentuk persegi panjang, sisi hitam penuh, dan sisi bergambar setengah hitam berbentuk segitiga) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) dapat dibentuk karena ketiga sisinya (sisi bergambar persegi kecil, sisi bergambar setengah hitam berbentuk persegi panjang, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (3) dapat dibentuk karena ketiga sisinya (sisi bergambar setengah hitam berbentuk segitiga, sisi kosong, dan sisi bergambar setengah hitam berbentuk persegi panjang) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (4) dapat dibentuk karena ketiga sisinya (sisi kosong, sisi bergambar persegi kecil, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Jadi, keempat kubus (1), (2), (3), dan (4) dapat dibentuk.<\/p><p><strong>Jawaban: C<\/strong><\/p>"}, {"no": 14, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 53.0 41.0\" width=\"200\" height=\"155\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,2.5 14.5,2.5 14.5,14.5 2.5,14.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"14.5,2.5 26.5,2.5 26.5,14.5 14.5,14.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"14.5,14.5 26.5,14.5 26.5,26.5 14.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"26.5,14.5 38.5,14.5 38.5,26.5 26.5,26.5\" fill=\"none\" stroke= ": "<p><strong>Pembahasan:<\/strong> Jika jaring-jaring (X) dilipat membentuk kubus, sisi-sisi yang saling berlawanan adalah: sisi kosong berlawanan dengan sisi bergambar garis tunggal; sisi bergambar garis ganda (=) berlawanan dengan sisi kosong; sisi kosong berlawanan dengan sisi bergambar arsiran. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi kosong, sisi bergambar garis tunggal, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) tidak dapat dibentuk karena memuat sisi bergambar belah ketupat, padahal sisi tersebut tidak ada pada jaring-jaring (X). Kubus (3) dapat dibentuk karena ketiga sisinya (sisi bergambar garis ganda (=), sisi kosong, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (4) dapat dibentuk karena ketiga sisinya (sisi bergambar garis tunggal, sisi bergambar arsiran, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Jadi, kubus (1), (3), dan (4) yang dapat dibentuk.<\/p><p><strong>Jawaban: C<\/strong><\/p>"}, {"no": 15, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 41.0 53.0\" width=\"200\" height=\"259\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,2.5 14.5,2.5 14.5,14.5 2.5,14.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/><polygon points=\"10.7,8.5 10.6,8.1 10.5,7.8 10.4,7.4 10.2,7.1 9.9,6.8 9.6,6.6 9.2,6.5 8.9,6.4 8.5,6.3 8.1,6.4 7.8,6.5 7.4,6.6 7.1,6.8 6.8,7.1 6.6,7.4 6.5,7.8 6.4,8.1 6.3,8.5 6.4,8.9 6.5,9.2 6.6,9.6 6.8,9.9 7.1,10.2 7.4,10.4 7.8,10.5 8.1,10.6 8.5,10.7 8.9,10.6 9.2,10.5 9.6,10.4 9.9,10.2 10.2,9.9 10.4,9.6 10.5,9.2 10.6, ": "B", "pembahasan_html": "<p><strong>Pembahasan:<\/strong> Jika jaring-jaring (X) dilipat membentuk kubus, sisi-sisi yang saling berlawanan adalah: sisi bergambar tanda + berlawanan dengan sisi bergambar persegi kecil; sisi kosong berlawanan dengan sisi bergambar setengah hitam berbentuk persegi panjang; sisi kosong berlawanan dengan sisi bergambar setengah hitam berbentuk segitiga. Kubus (1) dapat dibentuk karena ketiga sisinya (sisi bergambar setengah hitam berbentuk persegi panjang, sisi bergambar tanda +, dan sisi kosong) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (2) dapat dibentuk karena ketiga sisinya (sisi bergambar tanda +, sisi kosong, dan sisi bergambar setengah hitam berbentuk persegi panjang) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Kubus (3) tidak dapat dibentuk karena urutan ketiga sisinya (sisi bergambar setengah hitam berbentuk persegi panjang, sisi bergambar setengah hitam berbentuk segitiga, dan sisi bergambar persegi kecil) terbalik, seperti bayangan cermin dari hasil lipatan jaring-jaring (X). Kubus (4) dapat dibentuk karena ketiga sisinya (sisi kosong, sisi bergambar tanda +, dan sisi bergambar setengah hitam berbentuk segitiga) bertemu di satu sudut dengan susunan yang sesuai hasil lipatan jaring-jaring (X). Jadi, kubus (1), (2), dan (4) yang dapat dibentuk.<\/p><p><strong>Jawaban: B<\/strong><\/p>"}, {"no": 19, "pertanyaan": "Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.", "soal_html": "<p>Pilihlah kotak yang merupakan kotak yang terbentuk dari jaring-jaring (X) jika dilipat.<\/p><div class=\"jj-net\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 53.0 41.0\" width=\"200\" height=\"155\" role=\"img\" aria-label=\"Jaring-jaring (X)\" style=\"max-width:100%;height:auto\"><polygon points=\"2.5,14.5 14.5,14.5 14.5,26.5 2.5,26.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-linejoin=\"roun const $ = id => document.getElementById(id);
let cur = 0;
const jawab = {};

function render() {
  const q = DATA.soal[cur];
  $('qno').textContent = 'Soal ' + q.no + ' dari ' + DATA.soal.length;
  $('soal').innerHTML = q.soal_html;              // kalimat soal + SVG jaring-jaring + SVG kubus pilihan
  const opsi = $('opsi'); opsi.innerHTML = '';
  const done = jawab[cur] !== undefined;
  for (const L of ['A','B','C','D']) {
    const b = document.createElement('button');
    b.textContent = L + '.  ' + q.opsi[L];
    b.disabled = done;
    if (done && L === q.kunci) b.classList.add('correct');
    if (done && L === jawab[cur] && L !== q.kunci) b.classList.add('wrong');
    b.onclick = () => { jawab[cur] = L; render(); };
    opsi.appendChild(b);
  }
  $('pemb').innerHTML = done ? q.pembahasan_html : '';
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === DATA.soal.length - 1;
  renderChips();
}
function renderChips() {
  const c = $('chips'); c.innerHTML = '';
  DATA.soal.forEach((q, i) => {
    const b = document.createElement('button');
    b.textContent = q.no;
    if (i === cur) b.classList.add('cur');
    if (jawab[i] !== undefined) b.classList.add(jawab[i] === q.kunci ? 'ok' : 'bad');
    b.onclick = () => { cur = i; render(); };
    c.appendChild(b);
  });
}
$('judul').textContent = DATA.judul;
$('petunjuk').textContent = DATA.petunjuk;
$('prev').onclick = () => { if (cur > 0) { cur--; render(); } };
$('next').onclick = () => { if (cur < DATA.soal.length - 1) { cur++; render(); } };
$('skorBtn').onclick = () => {
  const n = DATA.soal.length, d = Object.keys(jawab).length;
  const benar = DATA.soal.filter((q, i) => jawab[i] === q.kunci).length;
  $('skor').textContent = 'Terjawab ' + d + '/' + n + ' | Benar ' + benar;
};
render();
</script>
